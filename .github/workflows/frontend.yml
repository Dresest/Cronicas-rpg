name: Verificar frontend
on:
  pull_request:
    branches: [main]
  push:
    branches: [mejoras-estabilidad-ui-v132]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript y compilar Vite
        run: npm run build
      - name: Comprobar sintaxis de la función de servidor
        run: node --check api/database-health.js
      - name: Probar comprobación de base de datos sin conexiones externas
        run: node --test tests/database-health.test.mjs
